# Source watch: shards whose sources must be READ on a change, not parsed.
#
# The refresh-*.yml workflows fetch a source and parse figures out of it. That
# is right for a bracket table and wrong for the six hand-authored Pillar 4
# shards (SPEC-4 §10.7), which carry prose transcribed from statutes and
# government consumer pages: auto-rewriting the site's most safety-critical
# sentences from a scraped page is precisely the failure to avoid. Two more
# joined them on 2026-08-30, for reasons the other refresh jobs cannot serve:
# Delaware's income tax, whose standard deduction is statutory and unindexed, so
# there is no annual figure to parse and a change to it is an amendment; and
# Medicaid, whose consequential content is not its 138% threshold but the map of
# which states expanded, stated only on a CMS table dated December 2023 — a
# closed document a parser would confirm forever and never see change. So this
# job never edits a shard. It fingerprints each source and opens an issue when
# one moved, asking a person to go re-read it. Its name says pillar4 for the
# history; `scripts/refresh/source-watch.json` is the list it actually watches.
name: Watch source documents

on:
  schedule:
    # Quarterly, on the 8th at 11:00 UTC. These sources change by amendment or
    # program announcement rather than on an annual calendar, so a fixed date
    # would miss them; a quarterly sweep catches a change within a season.
    - cron: "0 11 8 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - id: watch
        run: node scripts/refresh/watch-sources.ts

      # A check that never reported is not a quiet month.
      #
      # Every count this job gates on is read out of `$GITHUB_OUTPUT`, and the
      # script writes that block last -- after the fetches and the parsing. A
      # crash on the way there leaves every output UNSET, an unset output is the
      # empty string, and `'' != '0'` is true. So this job used to open an issue
      # with an empty body and a title ending in nothing, off the back of a
      # check that had not run.
      #
      # The issue below now requires a report to exist, and a missing one fails
      # the job here instead. A red scheduled run reaches the owner; a green one
      # that checked nothing does not.
      - name: Fail loudly if the check never reported
        if: steps.watch.outputs.report == ''
        run: |
          echo "::error::scripts/refresh/watch-sources.ts exited without writing its report."
          echo "::error::The counts this job gates on are unset: nothing was checked."
          exit 1

      # An issue, not a PR: there is no automated edit to review. The action a
      # person takes is reading the source and deciding whether the shard's
      # prose still says what the rule says.
      - name: Open a review issue when a source moved
        if: >-
          steps.watch.outputs.report != '' &&
          (steps.watch.outputs.changed != '0' ||
           steps.watch.outputs.unreachable != '0')
        uses: actions/github-script@v8
        with:
          script: |
            const report = process.env.REPORT;
            const title = `Pillar 4 source watch: ${process.env.CHANGED} source(s) changed`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: report,
              labels: ["data-review"],
            });
        env:
          REPORT: ${{ steps.watch.outputs.report }}
          CHANGED: ${{ steps.watch.outputs.changed }}
