# Federal Poverty Guidelines — HHS, annual (January). BUILD-SPEC.md §7.2.
name: Refresh HHS poverty guidelines

on:
  schedule:
    - cron: "0 12 20 1 *" # January 20, 12:00 UTC
  workflow_dispatch:

# The permissions `_data-refresh.yml` needs, stated here too: a called workflow
# is capped by its caller, so a caller that says nothing is a job whose scope
# depends on a repository setting rather than on this file.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    uses: ./.github/workflows/_data-refresh.yml
    with:
      group: hhs-poverty
      source_name: HHS Federal Poverty Guidelines (contiguous)
