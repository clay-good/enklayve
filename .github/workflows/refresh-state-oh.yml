# Ohio income tax — Ohio Dept. of Taxation annual rate schedule, annual
# (staggered). Graduated bracket-table state (the fifth-set parser); the CA
# workflow is the template. BUILD-SPEC.md §7.2, §8.
name: Refresh Ohio income tax

on:
  schedule:
    - cron: "0 12 22 5 *" # May 22, 12:00 UTC
  workflow_dispatch:

# The permissions `_data-refresh.yml` needs, stated here too: a called workflow
# is capped by its caller, so a caller that says nothing is a job whose scope
# depends on a repository setting rather than on this file.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    uses: ./.github/workflows/_data-refresh.yml
    with:
      group: state-oh
      source_name: Ohio income tax
