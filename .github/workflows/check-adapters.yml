# Adapter anchoring (BUILD-SPEC.md §7.3).
#
# Each refresh adapter regexes one figure out of one page. That works only while
# the page still states the figure. When an agency moves a number into a PDF or
# behind client-side rendering, the refresh stops parsing — it opens a fail-safe
# alert PR rather than shipping bad data, which is right — but the shard then
# stops being watched and sits at whatever year it was authored in, still
# carrying a live and apparently valid .gov citation.
#
# The August 2026 source audit found Illinois, Michigan, Missouri and Georgia a
# year or two stale for exactly that reason. This is the check that surfaces it
# without waiting for someone to read every alert PR.
#
# Like the link check it is deliberately NOT part of the unit CI: it needs the
# network, and a test that fails when a state's website has a bad afternoon
# teaches people to ignore failing tests.
name: Check refresh adapters

on:
  schedule:
    - cron: "0 11 8 * *" # the 8th of each month, 11:00 UTC — a week before the link check
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - id: adapters
        continue-on-error: true
        run: node scripts/check-adapters.ts

      # A check that never reported is not a quiet month.
      #
      # Every count this job gates on is read out of `$GITHUB_OUTPUT`, and the
      # script writes that block last -- after the fetches and the parsing. A
      # crash on the way there leaves every output UNSET, an unset output is the
      # empty string, and `'' != '0'` is true. So this job used to open an issue
      # with an empty body and a title ending in nothing, off the back of a
      # check that had not run.
      #
      # The issue below now requires a report to exist, and a missing one fails
      # the job here instead. A red scheduled run reaches the owner; a green one
      # that checked nothing does not.
      - name: Fail loudly if the check never reported
        if: steps.adapters.outputs.report == ''
        run: |
          echo "::error::scripts/check-adapters.ts exited without writing its report."
          echo "::error::The counts this job gates on are unset: nothing was checked."
          exit 1

      # Gated on REGRESSIONS against the committed known-anchoring baseline, not
      # on the raw count. Forty-odd adapters cannot anchor today; an issue
      # listing all of them every month is the alert people learn to close
      # unread. "Would change" also opens one, because a proposed change is
      # either a state updating its figures or a parser reading the wrong
      # number, and only a person reading the diff can tell. Unreachable is
      # usually the agency having an afternoon and appears in the body only.
      #
      # WAITS_OVER and BLIND_WAITS are two of the three states of an adapter
      # parked on a document a state has not published. An arrival means that
      # shard is now knowably a year behind, and a blind probe means nothing is
      # watching for the arrival any more — both are work, and both are silent
      # unless somebody is told. This job is the only thing that runs those
      # probes, so a count it does not read is a count nobody ever sees.
      #
      # UNREACHED_WAITS is the third, and it deliberately does NOT gate. Until
      # 2026-09-03 both halves of a wait probe returned a boolean, so a dropped
      # connection or a WAF's 403 on the calibration URL was indistinguishable
      # from a state having renamed its scheme — and that counted as BLIND,
      # which opens an issue claiming nothing is watching for the arrival. Only
      # a 404 or a 410 is an absence now; everything else is nobody's answer,
      # reported in the body and gated on by nothing. It is the same fix, and
      # the same reason, as the known-anchoring baseline one level up: a check
      # that cries wolf about the failure it exists to catch is worse than no
      # check. The same entry two months running is the thing to act on.
      - name: Open an issue when an adapter stopped anchoring, would change a shard, or its wait is over
        if: >-
          steps.adapters.outputs.report != '' &&
          (steps.adapters.outputs.regressions != '0' ||
           steps.adapters.outputs.wouldChange != '0' ||
           steps.adapters.outputs.waitsOver != '0' ||
           steps.adapters.outputs.blindWaits != '0')
        uses: actions/github-script@v8
        with:
          script: |
            const parts = [
              `${process.env.REGRESSIONS} stopped anchoring`,
              `${process.env.WOULD_CHANGE} would change a shard`,
            ];
            if (process.env.WAITS_OVER !== "0") parts.push(`${process.env.WAITS_OVER} wait(s) over`);
            if (process.env.BLIND_WAITS !== "0") parts.push(`${process.env.BLIND_WAITS} blind probe(s)`);
            if (process.env.UNREACHED_WAITS !== "0") {
              // Named in the title, never the reason the issue exists: this
              // line is only reached because one of the gated counts fired.
              parts.push(`${process.env.UNREACHED_WAITS} probe(s) not reached`);
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Adapter check: ${parts.join(", ")}`,
              body: process.env.REPORT,
              labels: ["data-review"],
            });
        env:
          REPORT: ${{ steps.adapters.outputs.report }}
          REGRESSIONS: ${{ steps.adapters.outputs.regressions }}
          WOULD_CHANGE: ${{ steps.adapters.outputs.wouldChange }}
          WAITS_OVER: ${{ steps.adapters.outputs.waitsOver }}
          BLIND_WAITS: ${{ steps.adapters.outputs.blindWaits }}
          UNREACHED_WAITS: ${{ steps.adapters.outputs.unreachedWaits }}
