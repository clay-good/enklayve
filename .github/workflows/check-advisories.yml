# Dependency-advisory triage (SPEC §2 principle 1 — the privacy claim is only as
# good as the code running on the device, and most of it is other people's).
#
# `npm audit` was reading nothing into this repo until 2026-09-02, when a
# moderate advisory in @xmldom/xmldom — the XML parser that reads a household's
# Word documents — turned out to have been open with nobody positioned to say
# whether it mattered. It did not. That is the normal case, which is why this
# gates on "an advisory nobody has looked at" rather than on "an advisory":
# a check that fires on every unreachable finding in a front-end dependency tree
# is one people mute.
#
# Since 2026-09-03 it also fires on `fixable`: a triage entry standing while npm
# reports a fix available. That entry was the reason -- it said the upgrade was
# out of reach behind mammoth's pin, which was true of 0.9 and false of the
# 0.8.15 backport published twelve days earlier. "There is no fix" is a fact
# with an expiry date, and npm was already reporting it.
#
# Not part of the unit CI: it needs the network, and the advisory database
# changes underneath a build that has not changed at all.
name: Check dependency advisories

on:
  schedule:
    - cron: "0 11 8 * *" # the 8th of each month, 11:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - id: advisories
        continue-on-error: true
        run: node scripts/check-advisories.ts

      # A check that never reported is not a quiet month.
      #
      # Every count this job gates on is read out of `$GITHUB_OUTPUT`, and the
      # script writes that block last -- after the fetches and the parsing. A
      # crash on the way there leaves every output UNSET, an unset output is the
      # empty string, and `'' != '0'` is true. So this job used to open an issue
      # with an empty body and a title ending in nothing, off the back of a
      # check that had not run. That is a reachable path here, not a
      # hypothetical one: `scripts/check-advisories.ts` exits before that block
      # when `npm audit` itself cannot run.
      #
      # The issue below now requires a report to exist, and a missing one fails
      # the job here instead. A red scheduled run reaches the owner; a green one
      # that checked nothing does not.
      - name: Fail loudly if the check never reported
        if: steps.advisories.outputs.report == ''
        run: |
          echo "::error::scripts/check-advisories.ts exited without writing its report."
          echo "::error::The counts this job gates on are unset: nothing was checked."
          exit 1

      # Gated on the two the script exits non-zero for: `untriaged` (nobody has
      # looked) and `fixable` (somebody looked and got the availability half
      # wrong). `stale` — a triage entry for an advisory that is no longer
      # reported — and the overdue-review warning are housekeeping: they appear
      # in the body when this fires, and an issue a month about tidying an
      # allowlist is how an alert becomes scenery.
      - name: Open an issue for an advisory nobody has reviewed, or one with a fix waiting
        if: >-
          steps.advisories.outputs.report != '' &&
          (steps.advisories.outputs.untriaged != '0' ||
           steps.advisories.outputs.fixable != '0')
        uses: actions/github-script@v8
        with:
          script: |
            const { UNTRIAGED, FIXABLE } = process.env;
            const parts = [];
            if (UNTRIAGED !== "0") parts.push(`${UNTRIAGED} not yet reviewed`);
            if (FIXABLE !== "0") parts.push(`${FIXABLE} with a fix available`);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Dependency advisories: ${parts.join(", ")}`,
              body: process.env.REPORT,
              labels: ["data-review"],
            });
        env:
          REPORT: ${{ steps.advisories.outputs.report }}
          UNTRIAGED: ${{ steps.advisories.outputs.untriaged }}
          FIXABLE: ${{ steps.advisories.outputs.fixable }}
          STALE: ${{ steps.advisories.outputs.stale }}
