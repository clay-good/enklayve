# Indiana income tax — IN DOR flat rate + personal exemption, annual (staggered). Flat-rate state, the IL workflow is the template. BUILD-SPEC.md §7.2, §8.
name: Refresh Indiana income tax

on:
  schedule:
    - cron: "0 12 8 3 *"
  workflow_dispatch:

# The permissions `_data-refresh.yml` needs, stated here too: a called workflow
# is capped by its caller, so a caller that says nothing is a job whose scope
# depends on a repository setting rather than on this file.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    uses: ./.github/workflows/_data-refresh.yml
    with:
      group: state-in
      source_name: Indiana income tax
