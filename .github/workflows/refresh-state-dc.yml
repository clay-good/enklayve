# District of Columbia income tax — DC Office of Tax and Revenue individual
# income tax rates, annual (staggered). One-adapter-per-state, the CA workflow
# is the template. BUILD-SPEC.md §7.2, §8.
name: Refresh DC income tax

on:
  schedule:
    - cron: "0 12 1 4 *" # April 1, 12:00 UTC
  workflow_dispatch:

# The permissions `_data-refresh.yml` needs, stated here too: a called workflow
# is capped by its caller, so a caller that says nothing is a job whose scope
# depends on a repository setting rather than on this file.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    uses: ./.github/workflows/_data-refresh.yml
    with:
      group: state-dc
      source_name: DC income tax
