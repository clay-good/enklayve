name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The gate reads the repository and writes nothing. `npm ci` runs install
# scripts from the dependency tree on every push and every pull request, and on
# a public repository that is the widest untrusted code path there is -- so the
# token it runs beside is scoped down to a read of the contents, explicitly,
# rather than inherited from whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 24 runs the TypeScript build scripts (audit, manifest) directly
          # via native type stripping, and matches .nvmrc.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # Family invariants gate (BUILD-SPEC.md §10): CSP connect-src 'none', no
      # cross-origin resource loads, every rule cited, no sensitive persistence.
      # Runs after the build so it can inspect dist/. Fails on any violation.
      - run: npm run audit

  # End-to-end (BUILD-SPEC.md §6/§10/§11): a real browser over the production
  # build verifies layout (no horizontal scroll on any view at any device
  # width), the offline service worker, and the deep-link → compute path —
  # things happy-dom cannot. Kept a separate job so the unit suite stays fast.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `--with-deps` runs `apt-get update`, which fails hard if ANY configured
      # repository is inconsistent — and the runner image ships Google's Chrome
      # repo, which on 2026-09-09 served a Release file whose hashes did not
      # match its own Packages.gz for hours. That took `main` red on a docs-only
      # commit. Nothing here needs that repo: Playwright downloads its own
      # Chromium build, and the OS packages it wants come from Ubuntu's.
      #
      # Matched by CONTENT rather than by filename: the first attempt removed
      # `google-chrome.list` and the job failed identically, because the image
      # declares it somewhere else (deb822 `.sources` among them). Anything
      # naming dl.google.com goes; nothing else is touched, and the step prints
      # what it removed so a future failure is not a mystery.
      - name: Drop the Chrome apt repo (not needed; broke apt-get update)
        run: |
          set -euo pipefail
          grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ /etc/apt/sources.list 2>/dev/null |
            tee /dev/stderr |
            xargs -r sudo rm -f
          echo "remaining apt sources:"
          ls -1 /etc/apt/sources.list.d/ 2>/dev/null || true
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
