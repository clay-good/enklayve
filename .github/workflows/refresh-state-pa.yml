# Pennsylvania income tax — PA DOR flat personal income tax rate, annual
# (staggered). Flat-rate state, the CA workflow is the template. BUILD-SPEC.md
# §7.2, §8.
name: Refresh Pennsylvania income tax

on:
  schedule:
    - cron: "0 12 15 4 *" # April 15, 12:00 UTC
  workflow_dispatch:

# The permissions `_data-refresh.yml` needs, stated here too: a called workflow
# is capped by its caller, so a caller that says nothing is a job whose scope
# depends on a repository setting rather than on this file.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    uses: ./.github/workflows/_data-refresh.yml
    with:
      group: state-pa
      source_name: Pennsylvania income tax
