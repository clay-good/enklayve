# Utah income tax — Utah State Tax Commission flat rate, annual (staggered). Flat-rate state, the PA workflow is the template (the taxpayer-tax-credit base amounts roll as the reviewer's data-only step). BUILD-SPEC.md §7.2, §8.
name: Refresh Utah income tax

on:
  schedule:
    - cron: "0 12 9 4 *"
  workflow_dispatch:

# The permissions `_data-refresh.yml` needs, stated here too: a called workflow
# is capped by its caller, so a caller that says nothing is a job whose scope
# depends on a repository setting rather than on this file.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    uses: ./.github/workflows/_data-refresh.yml
    with:
      group: state-ut
      source_name: Utah income tax
