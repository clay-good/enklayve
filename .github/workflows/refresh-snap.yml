# SNAP allotments & deductions — USDA FNS cost-of-living adjustment, annual
# (~October). BUILD-SPEC.md §7.2.
name: Refresh SNAP allotments

on:
  schedule:
    - cron: "0 12 1 10 *" # October 1, 12:00 UTC
  workflow_dispatch:

# The permissions `_data-refresh.yml` needs, stated here too: a called workflow
# is capped by its caller, so a caller that says nothing is a job whose scope
# depends on a repository setting rather than on this file.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    uses: ./.github/workflows/_data-refresh.yml
    with:
      group: usda-snap
      source_name: USDA FNS SNAP cost-of-living adjustment
