# Mississippi income tax — MS DOR flat rate over a floor (two-tier), annual (staggered). Graduated parser, the OH workflow is the template. BUILD-SPEC.md §7.2, §8.
name: Refresh Mississippi income tax

on:
  schedule:
    - cron: "0 12 22 4 *"
  workflow_dispatch:

# The permissions `_data-refresh.yml` needs, stated here too: a called workflow
# is capped by its caller, so a caller that says nothing is a job whose scope
# depends on a repository setting rather than on this file.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    uses: ./.github/workflows/_data-refresh.yml
    with:
      group: state-ms
      source_name: Mississippi income tax
