# The countdown to the annual roll.
#
# Six shards carry `staleAfterYears: 0` — the Pillar 4 group and free filing —
# so they lapse the instant their year does, and `docs/annual-roll.md` names
# them as the highest-harm figures here: a COBRA election window that is wrong
# is coverage that is simply gone.
#
# The lapse itself was handled — the loader marks the dataset stale and the tile
# shows its verify banner rather than a confident wrong number. Everything
# BEFORE it was not. The roll is a manual runbook with no trigger, so the first
# signal that six crisis-side tools had gone to banners would have been a reader
# seeing one on January 1st, and the sourcing pass those six want is six agency
# documents rather than an afternoon.
#
# Monthly, because the task is measured in weeks. Out of the unit CI for a
# reason peculiar to this check: its input is the date, and a test that starts
# failing on a date turns `main` red for work that has nothing to do with the
# roll.
name: Check for lapsing figures

on:
  schedule:
    - cron: "0 11 15 * *" # the 15th of each month, 11:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead to look (default 90)"
        required: false
        default: "90"

permissions:
  contents: read
  issues: write

jobs:
  lapses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - id: lapses
        continue-on-error: true
        env:
          DAYS: ${{ inputs.days || '90' }}
        run: node scripts/check-lapses.ts --days "$DAYS"

      # The same reasoning as every other scheduled check here: the count this
      # job gates on is read out of `$GITHUB_OUTPUT`, an unset output is the
      # empty string, and `'' != '0'` is true — so a crash before that block
      # would open an issue with an empty body off the back of a check that had
      # not run. A red scheduled run reaches the owner; a green one that checked
      # nothing does not.
      - name: Fail loudly if the check never reported
        if: steps.lapses.outputs.report == ''
        run: |
          echo "::error::scripts/check-lapses.ts exited without writing its report."
          exit 1

      - name: Open an issue when a bundled figure is about to expire
        if: >-
          steps.lapses.outputs.report != '' &&
          steps.lapses.outputs.due != '0'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `The annual roll is due: ${process.env.DUE} figure(s) expiring`,
              body: process.env.REPORT,
              labels: ["data-review"],
            });
        env:
          REPORT: ${{ steps.lapses.outputs.report }}
          DUE: ${{ steps.lapses.outputs.due }}

      # Visibly red, like the other four. A figure about to state a year that
      # has passed is not housekeeping.
      - name: Fail the run so the schedule is visibly red
        if: >-
          steps.lapses.outputs.report != '' &&
          steps.lapses.outputs.due != '0'
        run: exit 1
