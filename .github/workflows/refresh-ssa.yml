# FICA wage base — SSA Contribution and Benefit Base / COLA fact sheet, annual
# (October). BUILD-SPEC.md §7.2.
name: Refresh SSA FICA

on:
  schedule:
    - cron: "0 12 15 10 *" # October 15, 12:00 UTC
  workflow_dispatch:

# The permissions `_data-refresh.yml` needs, stated here too: a called workflow
# is capped by its caller, so a caller that says nothing is a job whose scope
# depends on a repository setting rather than on this file.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    uses: ./.github/workflows/_data-refresh.yml
    with:
      group: ssa
      source_name: SSA FICA wage base
