# CPI-U (inflation) — BLS public API, monthly (~2nd week). BUILD-SPEC.md §7.2.
name: Refresh CPI-U

on:
  schedule:
    - cron: "0 13 12 * *" # 12th of each month, 13:00 UTC
  workflow_dispatch:

# The permissions `_data-refresh.yml` needs, stated here too: a called workflow
# is capped by its caller, so a caller that says nothing is a job whose scope
# depends on a repository setting rather than on this file.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    uses: ./.github/workflows/_data-refresh.yml
    with:
      group: cpi
      source_name: BLS CPI-U annual averages
