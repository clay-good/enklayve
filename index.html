<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- The title, description, social copy, and structured data are rendered
         from the registry at build time (scripts/home-page.ts), so the counts
         and the catalog they claim cannot drift from the tools that exist. -->
    <!-- enklayve:head -->
    <link rel="canonical" href="https://enklayve.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#6D28D9" />
    <meta name="color-scheme" content="light" />

    <!-- Open Graph (social previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="enklayve" />
    <meta property="og:url" content="https://enklayve.com/" />
    <!-- A raster card (1200x630): SVG og:images don't render on Twitter/X,
         Facebook, LinkedIn, Slack, or iMessage. Regenerate with `npm run og:image`. -->
    <meta property="og:image" content="https://enklayve.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="enklayve — personal finance. Know where you stand. Privately."
    />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://enklayve.com/og-image.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>
  <body>
    <div id="app" class="app"><!-- enklayve:catalog --></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
