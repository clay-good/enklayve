# Federal income tax inflation adjustments — IRS annual revenue procedure,
# annual (October–November). BUILD-SPEC.md §7.2.
name: Refresh IRS federal income tax

on:
  schedule:
    - cron: "0 12 8 11 *" # November 8, 12:00 UTC
  workflow_dispatch:

# The permissions `_data-refresh.yml` needs, stated here too: a called workflow
# is capped by its caller, so a caller that says nothing is a job whose scope
# depends on a repository setting rather than on this file.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    uses: ./.github/workflows/_data-refresh.yml
    with:
      group: irs
      source_name: IRS federal income tax (annual revenue procedure)
