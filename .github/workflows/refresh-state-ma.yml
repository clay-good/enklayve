# Massachusetts income tax — MA DOR 5% base rate + 4% surtax, annual (staggered). Dedicated MA parser (surtax threshold inflation-adjusts yearly). BUILD-SPEC.md §7.2, §8.
name: Refresh Massachusetts income tax

on:
  schedule:
    - cron: "0 12 8 5 *"
  workflow_dispatch:

# The permissions `_data-refresh.yml` needs, stated here too: a called workflow
# is capped by its caller, so a caller that says nothing is a job whose scope
# depends on a repository setting rather than on this file.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    uses: ./.github/workflows/_data-refresh.yml
    with:
      group: state-ma
      source_name: Massachusetts income tax
